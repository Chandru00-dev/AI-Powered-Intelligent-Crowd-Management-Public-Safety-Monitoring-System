<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Management | AI Crowd & Public Safety System</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cameras.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fas fa-shield-alt"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">CROWD SAFETY</span>
          <span class="brand-badge">AI Surveillance</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-category">Surveillance Operations</div>
        <a href="dashboard.html" class="nav-link">
          <i class="fas fa-th-large"></i>
          <span>Command Center</span>
        </a>
        <a href="live-monitoring.html" class="nav-link">
          <i class="fas fa-video"></i>
          <span>Live Monitoring</span>
        </a>
        <a href="cameras.html" class="nav-link active">
          <i class="fas fa-camera-retro"></i>
          <span>Camera Management</span>
        </a>

        <div class="nav-category">System Configuration</div>
        <a href="settings.html" class="nav-link">
          <i class="fas fa-sliders"></i>
          <span>Safety Thresholds</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="user-avatar" id="current-user-avatar">A</div>
          <div class="user-info">
            <div class="user-name" id="current-user-name">System Admin</div>
            <div class="user-role" id="current-user-role">ADMIN</div>
          </div>
          <button class="logout-btn" id="btn-logout" title="Sign Out">
            <i class="fas fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-nav-toggle" id="btn-mobile-toggle">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="page-title">Surveillance Node Registry</h1>
        </div>

        <div class="topbar-right">
          <span class="badge badge-online" id="camera-count-badge">0 Nodes</span>
        </div>
      </header>

      <main class="content-body">
        <!-- Action & Search Bar -->
        <div class="page-action-bar">
          <div class="search-filter-box">
            <div class="search-input-wrap">
              <i class="fas fa-search"></i>
              <input 
                type="text" 
                id="camera-search-input" 
                class="form-control" 
                placeholder="Search camera name, location, or source type..." 
              />
            </div>
          </div>

          <button id="btn-add-camera" class="btn btn-primary admin-only">
            <i class="fas fa-plus"></i> Register New Camera Node
          </button>
        </div>

        <!-- Cameras Grid Container -->
        <div class="camera-cards-grid" id="cameras-grid">
          <!-- Dynamically populated via cameras.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Register / Edit Camera Modal -->
  <div class="modal-backdrop" id="camera-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1.15rem; font-weight: 700;">Register Surveillance Node</h3>
        <button class="close-btn" data-close-modal>&times;</button>
      </div>

      <form id="camera-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="camera-name">Camera Identifier / Name *</label>
            <input type="text" id="camera-name" class="form-control" placeholder="e.g. North Gate PTZ-01" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="camera-location">Installation Location *</label>
            <input type="text" id="camera-location" class="form-control" placeholder="e.g. Terminal 2 Departure Hall" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="camera-input-type">Video Feed Source Type *</label>
            <select id="camera-input-type" class="form-control" required>
              <option value="VIDEO_FILE">Pre-recorded Video File (.mp4)</option>
              <option value="WEBCAM">USB / Integrated Laptop Webcam</option>
              <option value="RTSP">RTSP CCTV IP Camera Stream</option>
            </select>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <label class="form-label" id="source-label" for="camera-source" style="margin-bottom: 0;">Video Source Endpoint *</label>
              <button type="button" id="btn-use-sample-video" class="demo-fill-btn" onclick="setSampleVideoPath()">
                <i class="fas fa-magic"></i> Use Packaged Sample Video
              </button>
            </div>
            <input type="text" id="camera-source" class="form-control" placeholder="c:/path/to/video.mp4 or 0 or rtsp://..." required />
            <div class="form-text" id="source-help">Enter the path, webcam index, or full RTSP URL.</div>
          </div>

          <!-- RTSP Credentials Section (Shown conditionally) -->
          <div id="rtsp-credentials-group" style="display: none; grid-template-columns: 1fr 1fr; gap: 1rem;" class="form-group">
            <div>
              <label class="form-label" for="camera-username">RTSP Username (Optional)</label>
              <input type="text" id="camera-username" class="form-control" placeholder="admin" autocomplete="off" />
            </div>
            <div>
              <label class="form-label" for="camera-password">RTSP Password (Optional)</label>
              <input type="password" id="camera-password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="new-password" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="camera-description">Operational Notes (Optional)</label>
            <textarea id="camera-description" class="form-control" rows="2" placeholder="Describe purpose or field of view..."></textarea>
          </div>

          <!-- Connection Probe Output Box -->
          <div id="candidate-test-result" style="display: none;" class="credentials-demo-box"></div>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-test-candidate" class="btn btn-secondary">
            <i class="fas fa-plug"></i> Test Connection
          </button>
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Save Node
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initCameras } from './js/cameras.js';
    import { AuthService } from './js/auth.js';

    document.getElementById('btn-logout').addEventListener('click', () => {
      AuthService.logout();
    });

    const mobileToggle = document.getElementById('btn-mobile-toggle');
    if (mobileToggle) {
      mobileToggle.addEventListener('click', () => {
        document.getElementById('app-sidebar').classList.toggle('open');
      });
    }

    initCameras();
  </script>
</body>
</html>
